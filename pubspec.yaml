name: islamic_app
description: An Islamic app with prayer times by country and region.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  intl: 0.20.2
  flutter_local_notifications: ^14.1.0
  timezone: ^0.9.0
  audioplayers: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/adhan/afasiadhan.mpeg
    - assets/adhan/qatamiadhan.mpeg
    - assets/adhan/moqassas.mpeg


flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true
