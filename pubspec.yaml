name: islamy_app
description: Islamic prayer times, Quran, Azkar and Duaa app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  geolocator: ^14.0.0
  geocoding: ^4.0.0
  intl: ^0.20.2
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  audioplayers: ^6.0.0
  google_fonts: ^8.1.0
  provider: ^6.0.0
  path_provider: ^2.1.1
  google_maps_flutter: ^2.13.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/adhan/
    - assets/reciters/afasi/
    - assets/reciters/sudais/
    - assets/reciters/muaiqly/
    - assets/reciters/minshawy/