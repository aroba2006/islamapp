name: islamy_app
description: Islamic prayer times, Quran, Azkar and Duaa app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  intl: ^0.20.2
  http: ^1.5.0
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  audioplayers: ^6.0.0
  google_fonts: ^8.1.0
  provider: ^6.0.0
  path_provider: ^2.1.1
  url_launcher: ^6.3.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_qiblah: ^3.2.0
  permission_handler: ^12.0.1
  flutter_launcher_icons: ^0.14.4
  just_audio: ^0.9.31
  audio_session: ^0.1.14
  share_plus: ^13.2.0
  equatable: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/compass-icon.png
    - assets/adhan/
    - assets/reciters/afasi/
    - assets/reciters/sudais/
    - assets/reciters/muaiqly/
    - assets/reciters/minshawy/
    - assets/quran_pages/